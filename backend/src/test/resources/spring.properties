# Spring TestContext cache: at most 12 application contexts are kept alive in the test JVM
# (Spring's default is 32). Phase 92 FU-8 / F-17: the suite builds ~41 distinct @SpringBootTest
# contexts, and with up to 32 of them cached the heap after a full GC stood at 2.6–3.0 GB of the
# Surefire -Xmx3g, so Backend CI OOMed intermittently on green code. Measured locally
# (`./mvnw test`, -Xmx3g, 7 452 tests): cache 32 → 29 full GCs, max heap after full GC 3 029 MB,
# 28:56; cache 12 → 2 full GCs, 1 355 MB, 26:27, and only 3 extra context builds (44 vs 41),
# because Surefire's class order rarely returns to an evicted context.
# Read through SpringProperties: this classpath-root file takes precedence over a
# -Dspring.test.context.cache.maxSize system property (which is then silently ignored), and
# junit-platform.properties does NOT apply to this key — to change the cap, edit this file.
# Raising it brings the OOM back; adding context-cache keys (backend/CLAUDE.md anti-patterns)
# costs rebuilds instead.
spring.test.context.cache.maxSize=12
